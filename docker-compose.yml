services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counterpart
      POSTGRES_PASSWORD: counterpart
      POSTGRES_DB: counterpart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterpart -d counterpart"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: counterpart-web-api
    build: ./apps/api
    env_file: .env
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://counterpart:counterpart@db:5432/counterpart
      CORS_ORIGINS: http://localhost:3010
      REDIS_URL: redis://redis:6379/0
      QSTASH_CALLBACK_URL: http://api:8000/webhooks/qstash/maintenance
      QSTASH_CURRENT_SIGNING_KEY: sig_7kYjw48mhY7kAjqNGcy6cr29RJ6r
      QSTASH_NEXT_SIGNING_KEY: sig_5ZB6DVzB1wjE8S6rZ7eenA8Pdnhs
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: counterpart-web-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8027:8025"

  worker:
    image: counterpart-web-api
    env_file: .env
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://counterpart:counterpart@db:5432/counterpart
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-Counterpart <notifications@counterpart.local>}
    command: python -m app.mail_worker
    depends_on:
      api:
        condition: service_healthy
      mail:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  qstash:
    image: public.ecr.aws/upstash/qstash:latest
    command: qstash dev
    ports:
      - "127.0.0.1:9012:8080"
      - "127.0.0.1:9013:8081"

volumes:
  pgdata:
  miniodata:
